name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM cross compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-linux-gnueabi
      - name: Build desktop runner
        run: g++ -O2 -std=c++17 -Wall -Wno-misleading-indentation -o gp2xcli tools/gp2xcli.cpp core/src/*.cpp
      - name: Guest program tests (Linux runtime, GP2X/Wiz hardware, old ABI)
        run: tests/run_tests.sh ./gp2xcli
      - name: CPU differential fuzz test (vs Unicorn ARM926)
        run: |
          g++ -O2 -std=c++17 -shared -fPIC -o libcputest.so tests/cpu_testlib.cpp core/src/arm926.cpp
          pip install unicorn==2.1.4
          python3 tests/cpu_fuzz.py ./libcputest.so 20000

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GP2XDroid-apk
          path: app/build/outputs/apk/debug/*.apk
